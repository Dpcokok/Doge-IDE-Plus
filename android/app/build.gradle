plugins {
    id 'com.android.application'
}

// APK 里的 web 资源直接来自仓库根目录，避免同一份代码维护两遍。
// app 模块的上级是 android/，所以仓库根要再往上一层。
def repoRoot = file('../..')
def webAppDir = layout.buildDirectory.dir('generated/webapp')

// 正式签名：release 构建必须配置 android/keystore.properties。
def keystoreFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
def hasKeystore = keystoreFile.exists()
if (hasKeystore) {
    keystoreFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.doge.ide'
    compileSdk 35

    defaultConfig {
        applicationId 'com.doge.ide.plus'
        minSdk 24
        // Local toolchains are executed from the app files directory. Android's
        // execute restriction for target 29+ blocks that workflow.
        targetSdk 28
        versionCode 6
        versionName '1.1.2'
    }

    signingConfigs {
        if (hasKeystore) {
            create('release') {
                storeFile rootProject.file(keystoreProps['storeFile'].toString())
                storePassword keystoreProps['storePassword'].toString()
                keyAlias keystoreProps['keyAlias'].toString()
                keyPassword keystoreProps['keyPassword'].toString()
            }
        }
    }

    buildTypes {
        release {
            // 无第三方依赖，混淆收益极小，换取构建可预测性
            minifyEnabled false
            signingConfig hasKeystore ? signingConfigs.getByName('release') : null
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets.main.jniLibs.srcDir('src/main/jniLibs')

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    defaultConfig {
        externalNativeBuild {
            cmake {
                abiFilters 'arm64-v8a'
            }
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

tasks.configureEach { task ->
    if (task.name == 'assembleRelease' || task.name == 'bundleRelease' || task.name == 'packageRelease') {
        task.doFirst {
            if (!hasKeystore) throw new GradleException('Release APK requires android/keystore.properties; use assembleDebug for test builds.')
        }
    }
}

tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    doFirst {
        if (!hasKeystore) throw new GradleException('Release APK requires android/keystore.properties; use assembleDebug for test builds.')
    }
}

extensions.getByName('android').sourceSets.main.assets.srcDir(webAppDir.get().asFile)

tasks.register('syncWebapp', Sync) {
    description = 'Copy doge-ide.html + web/ from the repo root into the APK assets'
    group = 'build'
    into webAppDir
    from(repoRoot) {
        include 'doge-ide.html'
        rename { 'index.html' }
    }
    from(repoRoot) {
        include 'web/**'
    }
}

tasks.named('preBuild').configure {
    dependsOn 'syncWebapp'
}
